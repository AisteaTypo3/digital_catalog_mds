<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{pagination.lastPageNumber} > 1">
    <nav class="dc-pagination" aria-label="{f:translate(key: 'pagination.label', extensionName: 'DigitalCatalog')}">

        <f:if condition="{pagination.previousPageNumber}">
            <a href="{pageUris.{pagination.previousPageNumber}}" rel="prev"
                class="dc-pagination__btn dc-pagination__btn--prev"
                aria-label="{f:translate(key: 'pagination.previous', extensionName: 'DigitalCatalog')}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </a>
        </f:if>

        <div class="dc-pagination__pages">
            <f:for each="{pagination.allPageNumbers}" as="page">
                <f:if condition="{page}">
                    <f:then>
                        <a href="{pageUris.{page}}"
                            class="dc-pagination__page {f:if(condition: '{page} == {currentPage}', then: 'dc-pagination__page--active')}"
                            aria-current="{f:if(condition: '{page} == {currentPage}', then: 'page')}">
                            {page}
                        </a>
                    </f:then>
                    <f:else>
                        <span class="dc-pagination__ellipsis">…</span>
                    </f:else>
                </f:if>
            </f:for>
        </div>

        <f:if condition="{pagination.nextPageNumber}">
            <a href="{pageUris.{pagination.nextPageNumber}}" rel="next"
                class="dc-pagination__btn dc-pagination__btn--next"
                aria-label="{f:translate(key: 'pagination.next', extensionName: 'DigitalCatalog')}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </a>
        </f:if>

    </nav>
</f:if>

</html>
